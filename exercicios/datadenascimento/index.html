<!DOCTYPE html>
<html lang="pt-br">
<head>

   <style>

<body>
    <h1>Verificador de idade</h1>
    <section>
        <p>
            <label for="nascimento">Ano de nascimento
            </label>    
            <input type="number" name="nascimento" id="nas">
        
        </p>

        <p>Sexo: 
            <input type="radio" name="sexo" id="masc">
            <label for="masc">Masculino</label>
            <input type="radio" name="sexo" id="fem">
            <label for="fem">Feminino</label>
        </p>
        
        <input type="button" value="Verificar" onclick="verificar()">

        <div id="res">
            <p>Preencha os dados acima para ver o resultado!</p>
        </div>
    </section>
    
    
    <script>
        function verificar(){
            var data=new Date()
            var ano= data.getFullYear()
            var fano=document.getElementById('nas')
            var res=document.getElementById('res')
            if(fano.value.length==0  || Number(fano.value)>ano){
                window.alert('Erro,os dados nao estao corretos')
            } else{
                var fsex=document.getElementsByName('sexo')
                var idade=ano-Number(fano.value)
                var genero=''
                if (fsex[0].checked){
                    genero='masculino'
                } else if(fsex[1].checked){
                    genero='mulher'
                }
                 

            }
        }

    </script>
</body>
