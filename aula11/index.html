<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
    <style>
        body{
            background-color: rgba(14, 14, 14, 0.788);
        }

    </style>
</head>
<body>
    <h1>Digite a sua Nacionalidade</h1>

    <input type="text" name="nacionalidade" id="nacionalidade" placeholder="Digite sua nacionalidade">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>

<script>
   function verificar(){
        var n=document.getElementById('nacionalidade')
        var res=document.getElementById('res')
        var valor= n.value
        
        if (valor=='Brasileiro') {
            res.innerHTML='<p>Parabens por ser brasileiro,nosso pais e lindo</p>'
        }
            
   }
    



</script>


</body>

</html>
