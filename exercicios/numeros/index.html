<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem</title>
    <style>
        body{
            background-color:rgb(75, 75, 211);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }
        header{
            text-align: center;
            margin: 50px;
            color: white;
            font-size: 30px;
        }
        section{
            height: 500px;
            width: 500px;
            background-color: white;
            margin: auto;
            padding: 20px;
            border-radius: 8px;

        }
        
        div{
            margin-bottom: 20px;

        }



        footer{
            text-align: center;
            color:white;
            margin: 20px;
        }

        select{
            width: 150px;
        }

    </style>

</head>
<body>
    <header>Analisador de Numeros</header>

    <section>
        <div>
            Numeros entre 1 e 100:  <input type="number" name="num" id="num">
            <input type="button" value="Adicionar" onclick="adicionar()">
        </div>
        
        <div id="res">
            <select name="tabuada" id="tabuada" size="10"></select> <br>
            <input type="button" value="Finalizar" onclick="finalizar()">

        </div>
    </section>

    <footer>CursoemVideo</footer>

    <script>
        let num=document.getElementById('num')
        let numeros=[];
        let tab=document.getElementById("tabuada")
        let res=document.getElementById('res')
            
        function isNumero(n){
            if(Number(n) >=1 && Number(n) <=100){
                return true
            }else{
                return false
            }

        }    
        
        function inLista(n, l){
            if (l.indexOf(Number(n)) != -1) {
                return true
            }else{
                return false
            }
        }     
        
        
        

        function adicionar(){
            if(isNumero(num.value) && !inLista(num.value,numeros)){
                numeros.push(Number(num.value))
                let item=document.createElement('option')
                item.text=(`Valor ${num.value} adicionado`)
                tab.appendChild(item)
                res,innerHTML=''

            }else {
                window.alert('valor invalido ou ja encontrado na lista')
            }
            num.value=''
            num.focus()
        }

        function finalizar(){
            if(numeros.length==0){
                window.alert('Adicione valores antes de finalizar!')
                return
            }else{
                let total = numeros.length
                let maior = numeros[0]
                let menor = numeros[0]
                let soma = 0
                let media = 0
                for (let pos in numeros) {
                soma += numeros[pos]
            
                if (numeros[pos] > maior) {
                maior = numeros[pos]
            }

            if (numeros[pos] < menor) {
                menor = numeros[pos]
            }
        }
            media = soma / total
            res.innerHTML = ''
            res.innerHTML += `<p>Ao todo, temos **${total}** números cadastrados.</p>`
            res.innerHTML += `<p>O **maior** valor informado foi **${maior}**.</p>`
            res.innerHTML += `<p>O **menor** valor informado foi **${menor}**.</p>`
            res.innerHTML += `<p>Somando todos os valores, temos **${soma}**.</p>`

            res.innerHTML += `<p>A **média** dos valores digitados é **${media.toFixed(2)}**.</p>`  

        }
        }


    </script>




</body>
</html>
